name: Actualizar precios desde Fudo

on:
  schedule:
    - cron: "17 0,10,15,18,21 * * *"   # 5 veces al día (hora de Concepción en verano: 7:17, 12:17, 15:17, 18:17 y 21:17)
  workflow_dispatch:         # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

jobs:
  carta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Leer productos de Fudo
        env:
          FUDO_API_KEY: ${{ secrets.FUDO_API_KEY }}
          FUDO_API_SECRET: ${{ secrets.FUDO_API_SECRET }}
        run: python3 scripts/actualizar_carta.py
      - name: Guardar cambios
        run: |
          if [ -n "$(git status --porcelain menu.json)" ]; then
            git config user.name "Actualizador de carta"
            git config user.email "actions@users.noreply.github.com"
            git add menu.json
            git commit -m "Actualiza precios desde Fudo"
            git push
          fi
