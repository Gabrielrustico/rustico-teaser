name: Indicadores mensuales desde Fudo

# Calcula los indicadores del mes (y del mes anterior) y los guarda en Supabase.
# No escribe nada en el repositorio: las cifras son internas y se ven solo en
# rusti-co.cl/equipo → Indicadores, con sesión de administrador.
on:
  schedule:
    # Cada hora de 8:23 a 1:23 (hora de Chile, verano). GitHub atrasa o se salta
    # corridas programadas cuando está cargado, así que se pide más seguido.
    - cron: "23 0-4,11-23 * * *"
  workflow_dispatch:
    inputs:
      meses:
        description: "Meses a recalcular, ej. 2026-09,2026-10 (vacío = mes actual y anterior)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  indicadores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Calcular y guardar indicadores
        env:
          FUDO_API_KEY: ${{ secrets.FUDO_API_KEY }}
          FUDO_API_SECRET: ${{ secrets.FUDO_API_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
          MESES: ${{ github.event.inputs.meses }}
        run: python3 scripts/indicadores.py
