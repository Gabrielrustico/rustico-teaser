<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Club Rusti-Co.</title>
<meta name="description" content="Únete al Club Rusti-Co.: 10 visitas = 1 pizza gratis, regalo de cumpleaños y novedades antes que nadie.">
<meta name="theme-color" content="#0d0a08">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap">
<style>
/* App del socio: una columna tipo celular, misma marca que la web. */
:root{
  --ink:#0d0a08; --ink-2:#17120e; --ink-3:#2a2119; --line:#2f251c;
  --cream:#f4ede2; --muted:#ab9f90; --gold:#ffd700; --gold-ink:#1a1405; --bad:#ff6b5a; --info:#7fb2ff;
  --font:"Montserrat","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--ink);color:var(--cream);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;font-weight:500;text-wrap:balance}
p{margin:0}
a{color:var(--cream)}
.app{max-width:440px;margin:0 auto;padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.head img{height:28px;width:auto}
.label{font-size:.68rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:.82rem}
.stack{display:grid;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;border:1px solid transparent;border-radius:999px;padding:.9em 1.3em;font-weight:600;font-size:.9rem;cursor:pointer;text-decoration:none;background:none}
.btn-gold{background:var(--gold);color:var(--gold-ink)}
.btn-line{border-color:var(--line);color:var(--cream)}
.btn-block{width:100%}
.btn-sm{padding:.5em .9em;font-size:.78rem}
.btn[disabled]{opacity:.5;cursor:wait}
.linkbtn{background:none;border:0;color:var(--muted);font-size:.8rem;text-decoration:underline;cursor:pointer;padding:0}
.box{background:var(--ink-2);border:1px solid var(--line);border-radius:18px;padding:18px}
.field{display:grid;gap:6px}
.field label{font-size:.8rem;font-weight:500;color:var(--muted)}
.field input{background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:.8em .9em;width:100%}
.field small{color:var(--muted);font-size:.74rem}
.check{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;font-size:.82rem;color:var(--cream);line-height:1.45}
.check input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--gold)}
.check em{font-style:normal;color:var(--muted)}
.consent{border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:14px}
.err{color:var(--bad);font-size:.85rem}
.note{color:var(--muted);font-size:.78rem;text-align:center}
.hero{border-radius:999px 999px 20px 20px;overflow:hidden;aspect-ratio:4/3;margin-bottom:20px;background:var(--ink-2)}
.hero img{width:100%;height:100%;object-fit:cover}
.perks{list-style:none;padding:0;margin:0 0 22px;display:grid;gap:10px}
.perks li{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:.9rem}
.perks i{width:14px;height:14px;border-radius:50%;background:var(--gold);margin-top:4px}
.card{background:linear-gradient(160deg,#1d1610 0%,#0f0b08 100%);border:1px solid var(--line);border-radius:22px;padding:20px;position:relative;overflow:hidden}
.card::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:var(--gold);opacity:.08}
.card-top{display:flex;justify-content:space-between;align-items:center}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:18px 0 14px}
.stamps span{aspect-ratio:1;border-radius:50%;border:1.5px dashed var(--ink-3);display:grid;place-items:center;font-size:.75rem;color:var(--muted)}
.stamps span.on{background:var(--gold);border:0;color:var(--gold-ink);font-weight:700}
.stamps span.prize{border:1.5px solid var(--gold);color:var(--gold);font-size:.55rem;font-weight:700;text-transform:uppercase;text-align:center;line-height:1.1}
.stamps span.prize.ready{background:var(--gold);color:var(--gold-ink)}
.bar{height:6px;border-radius:6px;background:var(--ink-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
.card-foot{display:flex;justify-content:space-between;margin-top:10px;font-size:.8rem;color:var(--muted)}
.card-foot b{color:var(--cream)}
.prize-box{margin-top:14px;background:var(--gold);color:var(--gold-ink);border-radius:14px;padding:14px;display:grid;gap:6px}
.prize-box code{font:700 1.3rem/1 var(--font);letter-spacing:.12em}
.section{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 10px}
.section h2{font-size:1rem;font-weight:600}
.stars{display:flex;gap:6px}
.stars button{background:none;border:0;padding:2px;cursor:pointer}
.stars svg{width:34px;height:34px;fill:var(--ink-3)}
.stars button.on svg{fill:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:none;color:var(--muted);border-radius:999px;padding:.4em .85em;font-size:.78rem;cursor:pointer}
.chips button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
textarea{width:100%;min-height:70px;background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:.8em;font:inherit;color:inherit;resize:vertical}
.promo{display:grid;grid-template-columns:60px 1fr;gap:14px;align-items:center}
.promo img{width:60px;height:60px;border-radius:50%;object-fit:cover;background:#050505}
.promo h3{font-size:.95rem;font-weight:600}
.promo p{font-size:.82rem;color:var(--muted)}
.pill{display:inline-block;font-size:.66rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--info);border:1px solid currentColor;border-radius:999px;padding:.15em .6em;margin-bottom:4px}
.code-row{display:flex;gap:10px;align-items:center;margin-top:10px}
.code-row code{flex:1;background:var(--ink);border:1px dashed var(--gold);color:var(--gold);border-radius:12px;padding:.7em;text-align:center;font:700 1.05rem var(--font);letter-spacing:.12em}
.history{list-style:none;padding:0;margin:0}
.history li{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:.85rem}
.history li:last-child{border-bottom:0}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:14px}
.switch{position:relative;width:46px;height:26px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--ink-3);border-radius:26px;cursor:pointer;transition:.2s}
.switch span::before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:var(--cream);border-radius:50%;transition:.2s}
.switch input:checked+span{background:var(--gold)}
.switch input:checked+span::before{transform:translateX(20px);background:var(--gold-ink)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--cream);color:var(--ink);padding:.8em 1.2em;border-radius:999px;font-weight:600;font-size:.85rem;z-index:50;max-width:calc(100% - 32px);text-align:center}
.loading{display:grid;place-items:center;min-height:50vh;color:var(--muted)}
</style>
</head>
<body>
<main class="app" id="app"><div class="loading">Cargando tu tarjeta…</div></main>
<div class="toast" id="toast" hidden></div>

<script>
/* ===== Ajustes ===== */
const API_URL = "https://script.google.com/macros/s/AKfycbxGEE89OFZEPTTve4zdjylVMj80sAnWi2TlRYvxKoQHSozT4GBWVHd7t93LMNxp2Q/exec";   // URL de la app web de Apps Script (termina en /exec)
const GOOGLE_REVIEW_URL = "https://g.page/r/CcTIIN9Gqc2wEAE/review";
const IMG = "../img/";
const CONSENT_VERSION = "2026-10-25";
/* =================== */

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = iso => iso ? new Date(iso + "T12:00:00").toLocaleDateString("es-CL", {day:"numeric", month:"short"}) : "";
const fmtMes = iso => iso ? new Date(iso + "T12:00:00").toLocaleDateString("es-CL", {month:"long", year:"numeric"}) : "";
const star = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3 6.6 7.2.7-5.4 4.8 1.6 7.1L12 17.6 5.6 21.2l1.6-7.1L1.8 9.3 9 8.6z"/></svg>';
const head = `<div class="head"><a href="../"><img src="${IMG}logo-color.png" alt="Rusti-Co."></a><span class="label">Club</span></div>`;
function toast(m){ const t=$("toast"); t.textContent=m; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,3200); }
const store = {
  get(){ try { return localStorage.getItem("rustico-club-token"); } catch(e){ return null; } },
  set(t){ try { t ? localStorage.setItem("rustico-club-token", t) : localStorage.removeItem("rustico-club-token"); } catch(e){} },
};
let mem = store.get();
const token = () => mem;
const setToken = t => { mem = t; store.set(t); };

async function api(accion, datos = {}){
  const r = await fetch(API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({accion, ...datos})});
  if (!r.ok) throw new Error("No pudimos conectarnos. Revisa tu internet e intenta de nuevo.");
  return r.json();
}
async function busy(btn, fn){ btn.disabled = true; try { return await fn(); } catch(e){ toast(e.message || "No pudimos conectarnos."); } finally { btn.disabled = false; } }

/* ---------- Bienvenida ---------- */
function welcome(){
  $("app").innerHTML = `${head}
    <div class="hero"><img src="${IMG}compartir.jpg" alt="Amigos compartiendo pizza en Rusti-Co."></div>
    <h1 style="font-size:1.7rem;font-weight:300">Únete al Club Rusti-Co.</h1>
    <p class="muted" style="margin:8px 0 18px">Gratis y en 30 segundos. Cada vez que vienes, sumas un sello.</p>
    <ul class="perks">
      <li><i></i><span><b>10 visitas = 1 pizza gratis</b> a elección.</span></li>
      <li><i></i><span><b>Regalo de cumpleaños:</b> postre gratis, o una Pizza Nutella por cada 6 personas en tu mesa.</span></li>
      <li><i></i><span><b>Invita a un amigo</b> y los dos suman una visita extra.</span></li>
      <li><i></i><span><b>Pruebas primero</b> las pizzas nuevas.</span></li>
    </ul>
    <div class="stack">
      <button class="btn btn-gold btn-block" type="button" id="goReg">Crear mi tarjeta</button>
      <button class="btn btn-line btn-block" type="button" id="goLogin">Ya soy socio</button>
    </div>`;
  $("goReg").onclick = register;
  $("goLogin").onclick = () => login();
}

/* ---------- Registro con autorizaciones separadas ---------- */
function register(){
  const ref = new URLSearchParams(location.search).get("amigo") || "";
  $("app").innerHTML = `${head}
    <h1 style="font-size:1.5rem;font-weight:300;margin-bottom:6px">Crea tu tarjeta</h1>
    <p class="muted small" style="margin-bottom:20px">Solo pedimos lo necesario para el Club.</p>
    <form id="f" class="stack" novalidate>
      <div class="field"><label for="nombre">Nombre y apellido</label><input id="nombre" autocomplete="name" required></div>
      <div class="field"><label for="tel">Celular</label><input id="tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="+56 9 1234 5678" required><small>Con él te encontramos en la caja.</small></div>
      <div class="field"><label for="mail">Correo</label><input id="mail" type="email" autocomplete="email" placeholder="tu@correo.cl" required><small>Ahí te llega tu código para entrar desde otro celular.</small></div>
      <div class="field"><label for="cumple">Fecha de cumpleaños <span class="muted">(opcional, para tu regalo)</span></label><input id="cumple" type="date"></div>
      <div class="field"><label for="ref">Código de un amigo <span class="muted">(opcional)</span></label><input id="ref" value="${esc(ref)}" placeholder="Ej: MATIAS-50" autocapitalize="characters"></div>
      <div class="consent">
        <label class="check"><input type="checkbox" id="c18"><span>Soy mayor de 18 años.</span></label>
        <label class="check"><input type="checkbox" id="cClub"><span>Autorizo a Rusti-Co. a usar mis datos para <b>administrar mi membresía del Club</b>: registrar mis visitas, entregarme premios y mi regalo de cumpleaños, y pedirme que califique mis visitas. <em>Obligatorio para unirte.</em></span></label>
        <label class="check"><input type="checkbox" id="cPromo"><span>Quiero recibir <b>promociones y novedades</b> de Rusti-Co. por WhatsApp y correo. <em>Opcional. Puedes cambiarlo cuando quieras.</em></span></label>
        <p class="small muted">Lee la <a href="privacidad.html" target="_blank" rel="noopener">política de privacidad</a>: qué datos guardamos, para qué, por cuánto tiempo y cómo ejercer tus derechos. Puedes retirar tu autorización y eliminar tus datos desde tu tarjeta.</p>
      </div>
      <p class="err" id="err" hidden></p>
      <button class="btn btn-gold btn-block" type="submit" id="send">Crear mi tarjeta</button>
      <button class="linkbtn" type="button" id="back">Volver</button>
    </form>`;
  $("back").onclick = welcome;
  $("f").addEventListener("submit", e => {
    e.preventDefault();
    const err = $("err"); err.hidden = true;
    const fail = m => { err.textContent = m; err.hidden = false; };
    if (!$("c18").checked) return fail("El Club es solo para mayores de 18 años.");
    if (!$("cClub").checked) return fail("Para unirte al Club necesitamos tu autorización para administrar tu membresía.");
    busy($("send"), async () => {
      const r = await api("registrar", {
        nombre: $("nombre").value, telefono: $("tel").value, email: $("mail").value, cumpleanos: $("cumple").value,
        referido: $("ref").value, mayor_18: true, acepta_club: true, acepta_promos: $("cPromo").checked, version: CONSENT_VERSION,
      });
      if (!r.ok) return fail(r.error);
      if (r.yaExiste) { toast(r.mensaje); return code($("tel").value); }
      setToken(r.token); card(r.tarjeta); toast("¡Bienvenido al Club! Ya tienes tu tarjeta.");
    });
  });
}

/* ---------- Entrar con código ---------- */
function login(){
  $("app").innerHTML = `${head}
    <h1 style="font-size:1.5rem;font-weight:300;margin-bottom:6px">Entra a tu tarjeta</h1>
    <p class="muted small" style="margin-bottom:20px">Te enviaremos un código a tu correo.</p>
    <form id="f" class="stack" novalidate>
      <div class="field"><label for="tel">Celular</label><input id="tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="+56 9 1234 5678"></div>
      <p class="err" id="err" hidden></p>
      <button class="btn btn-gold btn-block" type="submit" id="send">Enviarme el código</button>
      <button class="linkbtn" type="button" id="back">Volver</button>
    </form>`;
  $("back").onclick = welcome;
  $("f").addEventListener("submit", e => { e.preventDefault();
    busy($("send"), async () => { const r = await api("pedirCodigo", {telefono: $("tel").value});
      if (!r.ok) { $("err").textContent = r.error; $("err").hidden = false; return; }
      toast(r.mensaje); code($("tel").value); });
  });
}
function code(tel){
  $("app").innerHTML = `${head}
    <h1 style="font-size:1.5rem;font-weight:300;margin-bottom:6px">Revisa tu correo</h1>
    <p class="muted small" style="margin-bottom:20px">Escribe el código de 6 dígitos que te enviamos. Vence en 10 minutos.</p>
    <form id="f" class="stack" novalidate>
      <div class="field"><label for="cod">Código</label><input id="cod" inputmode="numeric" autocomplete="one-time-code" maxlength="6" style="font-size:1.4rem;letter-spacing:.3em;text-align:center"></div>
      <p class="err" id="err" hidden></p>
      <button class="btn btn-gold btn-block" type="submit" id="send">Entrar</button>
      <button class="linkbtn" type="button" id="again">Enviar otro código</button>
    </form>`;
  $("cod").focus();
  $("again").onclick = () => login();
  $("f").addEventListener("submit", e => { e.preventDefault();
    busy($("send"), async () => { const r = await api("verificarCodigo", {telefono: tel, codigo: $("cod").value});
      if (!r.ok) { $("err").textContent = r.error; $("err").hidden = false; return; }
      setToken(r.token); card(r.tarjeta); });
  });
}

/* ---------- Tarjeta ---------- */
function card(t){
  const N = t.club.visitasParaPremio, st = Math.min(t.sellos, N), left = N - st, ready = st >= N;
  const first = t.nombre.split(" ")[0];
  const bday = t.cumpleanos && +t.cumpleanos.slice(5,7) === new Date().getMonth() + 1;
  const invite = location.origin + location.pathname + "?amigo=" + encodeURIComponent(t.codigo);
  $("app").innerHTML = `${head}
    <div><h1 style="font-size:1.6rem;font-weight:300">Hola, ${esc(first)}</h1>
      <p class="muted" style="margin-top:4px">${ready ? "¡Tu pizza gratis está lista!" : `Te ${left===1?"falta 1 visita":`faltan ${left} visitas`} para tu pizza gratis.`}</p></div>

    <div class="card" style="margin-top:18px">
      <div class="card-top"><span class="label">Tarjeta de socio</span><span class="small muted">${esc(t.telefono)}</span></div>
      <div class="stamps">${Array.from({length:N},(_,i)=> i===N-1 ? `<span class="prize${ready?" ready":""}">Pizza<br>gratis</span>` : `<span class="${i<st?"on":""}">${i+1}</span>`).join("")}</div>
      <div class="bar"><i style="width:${st/N*100}%"></i></div>
      <div class="card-foot"><span>Socio desde ${esc(fmtMes(t.alta))}</span><b>${st} / ${N}</b></div>
      ${ready ? `<div class="prize-box"><span class="label" style="color:var(--gold-ink)">Muestra esta pantalla al pagar</span><code>${esc(t.codigo)}</code><span class="small">${esc(t.club.premio)}</span></div>` : ""}
    </div>
    <p class="note" style="margin-top:10px">Al pedir, dile al garzón tu nombre o teléfono para sumar tu sello.</p>

    ${t.calificarVisita ? `<div class="box" id="rate" style="margin-top:16px;border-color:var(--gold)">
      <span class="label" style="color:var(--gold)">Tu visita del ${esc(fmt(t.calificarVisita))}</span>
      <h3 style="margin:6px 0 12px">¿Cómo estuvo todo?</h3>
      <div class="stars" id="stars">${[1,2,3,4,5].map(i=>`<button type="button" data-v="${i}" aria-label="${i} estrella${i>1?"s":""}">${star}</button>`).join("")}</div>
      <div id="more" hidden class="stack" style="margin-top:14px">
        <p class="small muted" id="q"></p>
        <div class="chips">${["Pizza","Atención","Tiempo de espera","Ambiente","Precio","Tragos"].map(x=>`<button type="button" aria-pressed="false">${x}</button>`).join("")}</div>
        <textarea id="com" placeholder="Comentario (opcional)" aria-label="Comentario"></textarea>
        <button class="btn btn-gold btn-block" type="button" id="sendRate">Enviar calificación</button>
      </div></div>` : ""}

    ${bday ? `<div class="box" style="margin-top:16px;border-color:var(--gold)"><span class="label" style="color:var(--gold)">Es tu mes</span><h3 style="margin-top:6px">¡Feliz cumpleaños! 🎂</h3><p class="small muted" style="margin-top:4px">${esc(t.club.regaloCumpleanos)}. Muestra esta pantalla en el local.</p></div>` : ""}

    <div class="section"><h2>Para socios</h2><span class="label">${t.club.promos.length} activas</span></div>
    <div class="stack">${t.club.promos.map(p=>`<div class="box promo"><img src="${IMG}${esc(p.foto||"schop")}.jpg" alt="">
      <div>${p.novedad?'<span class="pill">Primero tú</span>':""}<h3>${esc(p.titulo)}</h3><p>${esc(p.detalle)}</p>${p.hasta?`<p class="small">Hasta el ${esc(fmt(p.hasta))}</p>`:""}</div></div>`).join("") || '<p class="small muted">Pronto tendrás beneficios exclusivos aquí.</p>'}</div>

    <div class="section"><h2>Invita a un amigo</h2></div>
    <div class="box"><p class="small muted">Cuando tu amigo se registra con tu código y hace su primera visita, los dos suman ${t.club.bonoReferido} visita extra.</p>
      <div class="code-row"><code>${esc(t.codigo)}</code><button class="btn btn-line btn-sm" type="button" id="copy">Copiar link</button></div></div>

    <div class="section"><h2>¿Te gustó? Cuéntalo en Google</h2></div>
    <div class="box"><p class="small muted" style="margin-bottom:12px">Tu reseña ayuda a que más vecinos de Concepción nos encuentren.</p>
      <a class="btn btn-line btn-block" href="${GOOGLE_REVIEW_URL}" target="_blank" rel="noopener">Calificar en Google</a></div>

    <div class="section"><h2>Tus visitas</h2><span class="label">${t.visitasTotal} en total</span></div>
    <div class="box"><ul class="history">${t.visitas.map(v=>`<li><span>${esc(fmt(v))}</span><span class="muted">+1 sello</span></li>`).join("") || '<li class="muted">Aún no tienes visitas. ¡Te esperamos!</li>'}</ul></div>

    <div class="section"><h2>Mis datos y autorizaciones</h2></div>
    <div class="box stack">
      <div class="toggle"><span class="small">Recibir promociones y novedades por WhatsApp y correo</span>
        <label class="switch"><input type="checkbox" id="promo" ${t.aceptaPromos?"checked":""} aria-label="Recibir promociones"><span></span></label></div>
      <p class="small muted">${esc(t.email)} · ${esc(t.telefono)}${t.cumpleanos?` · cumpleaños ${esc(fmt(t.cumpleanos))}`:""}</p>
      <p class="small muted">Para corregir tus datos o ejercer tus derechos escribe a administracion@rusti-co.cl. <a href="privacidad.html" target="_blank" rel="noopener">Política de privacidad</a>.</p>
      <button class="linkbtn" type="button" id="del" style="justify-self:start">Salir del Club y eliminar mis datos</button>
      <div id="delBox" hidden class="stack" style="border-top:1px solid var(--line);padding-top:14px">
        <p class="small">Vas a perder tu tarjeta y tus ${t.sellos} sellos. Esto no se puede deshacer.</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-sm" style="background:var(--bad);color:#1a0705" type="button" id="delYes">Sí, eliminar mis datos</button><button class="btn btn-line btn-sm" type="button" id="delNo">Cancelar</button></div>
      </div>
    </div>
    <p class="note" style="margin-top:22px"><button class="linkbtn" type="button" id="out">Cerrar sesión en este celular</button></p>`;

  $("copy").onclick = async () => { try { await navigator.clipboard.writeText(invite); toast("Link copiado. Compártelo con tus amigos."); } catch(e){ toast("Tu código es " + t.codigo); } };
  $("out").onclick = () => { setToken(null); welcome(); };
  $("del").onclick = () => { $("delBox").hidden = false; };
  $("delNo").onclick = () => { $("delBox").hidden = true; };
  $("delYes").onclick = e => busy(e.target, async () => { const r = await api("eliminarme", {token: token()});
    if (!r.ok) return toast(r.error); setToken(null); welcome(); toast("Tus datos fueron eliminados. ¡Gracias por haber sido parte del Club!"); });
  $("promo").onchange = e => busy(e.target, async () => { const r = await api("preferencias", {token: token(), acepta_promos: e.target.checked});
    if (!r.ok) { e.target.checked = !e.target.checked; return toast(r.error); }
    toast(e.target.checked ? "Listo: te avisaremos de promociones." : "Listo: ya no recibirás promociones."); });

  if (t.calificarVisita) {
    let val = 0;
    const btns = [...document.querySelectorAll("#stars button")];
    btns.forEach(b => b.onclick = () => { val = +b.dataset.v; btns.forEach(x => x.classList.toggle("on", +x.dataset.v <= val)); $("more").hidden = false;
      $("q").textContent = val >= 4 ? "¡Qué bueno! ¿Qué fue lo mejor?" : "Lo sentimos. ¿Qué podemos mejorar?"; });
    document.querySelectorAll(".chips button").forEach(b => b.onclick = () => b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true"));
    $("sendRate").onclick = e => busy(e.target, async () => {
      const temas = [...document.querySelectorAll('.chips button[aria-pressed="true"]')].map(b => b.textContent);
      const r = await api("calificar", {token: token(), estrellas: val, temas, comentario: $("com").value});
      if (!r.ok) return toast(r.error);
      $("rate").innerHTML = val >= 4
        ? `<span class="label" style="color:var(--gold)">Gracias</span><h3 style="margin:6px 0 8px">¡Nos alegra que lo hayas disfrutado!</h3><p class="small muted" style="margin-bottom:12px">¿Nos regalas 30 segundos en Google? Ayuda mucho a un local nuevo.</p><a class="btn btn-gold btn-block" href="${GOOGLE_REVIEW_URL}" target="_blank" rel="noopener">Dejar reseña en Google</a>`
        : `<span class="label" style="color:var(--gold)">Gracias</span><h3 style="margin:6px 0 8px">Gracias por contarnos</h3><p class="small muted" style="margin-bottom:12px">El encargado ya recibió tu comentario y te escribirá para solucionarlo. Si prefieres, escríbele tú directo al +56 9 8415 0886.</p><div class="stack"><a class="btn btn-gold btn-block" href="https://wa.me/56984150886?text=Hola%20Rusti-Co.%2C%20quiero%20comentarles%20sobre%20mi%20visita%3A%20" target="_blank" rel="noopener">Escribir por WhatsApp</a><a class="btn btn-line btn-block" href="${GOOGLE_REVIEW_URL}" target="_blank" rel="noopener">También puedes dejar tu reseña en Google</a></div>`;
    });
  }
}

/* ---------- Inicio ---------- */
(async function start(){
  if (!API_URL.startsWith("https://")) { welcome(); return; }
  if (!token()) { new URLSearchParams(location.search).get("amigo") ? register() : welcome(); return; }
  try {
    const r = await api("miTarjeta", {token: token()});
    if (r.ok) return card(r.tarjeta);
    setToken(null); toast(r.error || "Tu sesión venció."); login();
  } catch(e) { $("app").innerHTML = `${head}<div class="box"><p>No pudimos cargar tu tarjeta. Revisa tu internet.</p><button class="btn btn-gold btn-block" style="margin-top:14px" type="button" onclick="location.reload()">Reintentar</button></div>`; }
})();
</script>
</body>
</html>
