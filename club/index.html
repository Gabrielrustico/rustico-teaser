<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Club Rusti-Co.</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: app de una columna para el cliente (como un celular) y panel ancho para el local.
   Misma marca que la web: negro cálido, amarillo Rusti-Co., Montserrat. */
:root{
  --ink:#0d0a08; --ink-2:#17120e; --ink-3:#2a2119; --line:#2f251c;
  --cream:#f4ede2; --muted:#ab9f90; --gold:#ffd700; --gold-ink:#1a1405;
  --good:#4cd27a; --warn:#ffb020; --bad:#ff6b5a; --info:#7fb2ff;
  --font:"Montserrat","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--ink);color:var(--cream);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;font-weight:500;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Barra demo */
.demo{background:var(--ink-2);border-bottom:1px solid var(--line)}
.demo .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px;max-width:1180px;margin:0 auto}
.demo .badge{font-size:.68rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;background:var(--gold);color:var(--gold-ink);border-radius:999px;padding:.3em .7em}
.demo p{color:var(--muted);font-size:.8rem;flex:1;min-width:200px}
.switch{display:inline-flex;background:var(--ink);border:1px solid var(--line);border-radius:999px;padding:3px}
.switch button{border:0;background:transparent;color:var(--muted);padding:.45em 1em;border-radius:999px;font-size:.8rem;font-weight:600;cursor:pointer}
.switch button[aria-pressed="true"]{background:var(--cream);color:var(--ink)}
.linkbtn{background:none;border:0;color:var(--muted);font-size:.78rem;text-decoration:underline;cursor:pointer;padding:0}

/* Componentes */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;border:1px solid transparent;border-radius:999px;padding:.85em 1.3em;font-weight:600;font-size:.88rem;cursor:pointer;text-decoration:none;transition:transform .12s ease}
.btn:active{transform:scale(.98)}
.btn-gold{background:var(--gold);color:var(--gold-ink)}
.btn-line{background:transparent;border-color:var(--line);color:var(--cream)}
.btn-ghost{background:var(--ink-3);color:var(--cream)}
.btn-sm{padding:.5em .9em;font-size:.78rem}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.box{background:var(--ink-2);border:1px solid var(--line);border-radius:18px;padding:18px}
.label{font-size:.68rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.stack{display:grid;gap:14px}
.field{display:grid;gap:6px}
.field label{font-size:.8rem;font-weight:500;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:.8em .9em;width:100%}
.field textarea{resize:vertical;min-height:70px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.8rem;color:var(--muted)}
.check input{margin-top:3px;accent-color:var(--gold)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.7rem;font-weight:600;letter-spacing:.06em;border-radius:999px;padding:.25em .7em;border:1px solid currentColor;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-new{color:var(--info)} .s-active{color:var(--good)} .s-risk{color:var(--warn)} .s-lost{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--cream);color:var(--ink);padding:.8em 1.2em;border-radius:999px;font-weight:600;font-size:.85rem;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:calc(100% - 32px);text-align:center}
.tabular{font-variant-numeric:tabular-nums}

/* ===== Vista cliente ===== */
.phone{max-width:440px;margin:0 auto;padding-block:20px 60px}
.app-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.app-head img{height:28px;width:auto}
.hello h1{font-size:1.6rem;font-weight:300}
.hello p{color:var(--muted);margin-top:4px}
.card{background:linear-gradient(160deg,#1d1610 0%,#0f0b08 100%);border:1px solid var(--line);border-radius:22px;padding:20px;position:relative;overflow:hidden}
.card::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:var(--gold);opacity:.08}
.card-top{display:flex;justify-content:space-between;align-items:center}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:18px 0 14px}
.stamps span{aspect-ratio:1;border-radius:50%;border:1.5px dashed var(--ink-3);display:grid;place-items:center;font-size:.75rem;color:var(--muted)}
.stamps span.on{background:var(--gold);border:0;color:var(--gold-ink);font-weight:700;animation:pop .35s ease}
.stamps span.prize{border:1.5px solid var(--gold);color:var(--gold);font-size:.55rem;font-weight:700;text-transform:uppercase;text-align:center;line-height:1.1;letter-spacing:.04em}
.stamps span.prize.ready{background:var(--gold);color:var(--gold-ink)}
@keyframes pop{0%{transform:scale(.6)}80%{transform:scale(1.08)}100%{transform:scale(1)}}
.bar{height:6px;border-radius:6px;background:var(--ink-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);transition:width .4s ease}
.card-foot{display:flex;justify-content:space-between;margin-top:10px;font-size:.8rem;color:var(--muted)}
.card-foot b{color:var(--cream)}
.prize-box{margin-top:14px;background:var(--gold);color:var(--gold-ink);border-radius:14px;padding:14px;display:grid;gap:6px}
.prize-box code{font:700 1.3rem/1 var(--font);letter-spacing:.12em}
.section-title{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 10px}
.section-title h2{font-size:1rem;font-weight:600}
.stars{display:flex;gap:6px}
.stars button{background:none;border:0;padding:2px;cursor:pointer}
.stars svg{width:34px;height:34px;fill:var(--ink-3);transition:fill .1s}
.stars button.on svg{fill:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:.4em .85em;font-size:.78rem;cursor:pointer}
.chips button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.promo{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center}
.promo img{width:64px;height:64px;border-radius:50%;object-fit:cover;background:#050505}
.promo h3{font-size:.95rem;font-weight:600}
.promo p{font-size:.82rem;color:var(--muted)}
.code-row{display:flex;gap:10px;align-items:center;margin-top:10px}
.code-row code{flex:1;background:var(--ink);border:1px dashed var(--gold);color:var(--gold);border-radius:12px;padding:.7em;text-align:center;font:700 1.05rem var(--font);letter-spacing:.12em}
.history{list-style:none;padding:0;margin:0;display:grid}
.history li{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:.85rem}
.history li:last-child{border-bottom:0}
.reg-hero{border-radius:999px 999px 20px 20px;overflow:hidden;aspect-ratio:4/3;margin-bottom:20px;background:var(--ink-2)}
.reg-hero img{width:100%;height:100%;object-fit:cover}

/* ===== Vista local ===== */
.panel{max-width:1180px;margin:0 auto;padding-block:20px 60px}
.panel-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-bottom:18px}
.panel-head img{height:26px;width:auto}
.panel-head h1{font-size:1.15rem;font-weight:500}
.fudo{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:.4em .9em}
.fudo i{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.ptabs{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:22px;scrollbar-width:none}
.ptabs::-webkit-scrollbar{display:none}
.ptabs button{flex:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:.8em .9em;font-weight:600;font-size:.85rem;cursor:pointer}
.ptabs button[aria-selected="true"]{color:var(--cream);border-color:var(--gold)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}
.kpi{background:var(--ink-2);border:1px solid var(--line);border-radius:16px;padding:16px}
.kpi b{display:block;font-size:1.8rem;font-weight:300;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-size:.75rem}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.grid2 > *{min-width:0}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.search{display:flex;gap:10px}
.search input{flex:1;min-width:0;background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:.8em .9em}
.cust{display:grid;gap:12px}
.cust-head{display:flex;justify-content:space-between;align-items:start;gap:10px}
.cust-head h3{font-size:1.1rem}
.mini-stamps{display:flex;gap:5px;flex-wrap:wrap}
.mini-stamps i{width:18px;height:18px;border-radius:50%;border:1.5px dashed var(--ink-3)}
.mini-stamps i.on{background:var(--gold);border:0}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px}
table{width:100%;border-collapse:collapse;font-size:.84rem}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--ink-2)}
tr:last-child td{border-bottom:0}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.segs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}
.seg{background:var(--ink-2);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;text-align:left;display:grid;gap:6px}
.seg[aria-pressed="true"]{border-color:var(--gold)}
.seg b{font-size:1.6rem;font-weight:300;font-variant-numeric:tabular-nums}
.seg p{font-size:.78rem;color:var(--muted)}
@media (max-width:760px){.segs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.msg{background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:.85rem;white-space:pre-wrap}
.rating{display:grid;gap:6px;padding:14px 0;border-bottom:1px solid var(--line)}
.rating:last-child{border-bottom:0}
.rating .top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.rstars{color:var(--gold);letter-spacing:2px}
.rstars s{color:var(--ink-3);text-decoration:none}
.barchart{display:grid;gap:8px}
.barchart div{display:grid;grid-template-columns:70px 1fr 34px;gap:10px;align-items:center;font-size:.8rem}
.barchart span.track{height:8px;background:var(--ink-3);border-radius:8px;overflow:hidden}
.barchart span.track i{display:block;height:100%;background:var(--gold)}
</style>
</head>
<body>

<div class="demo">
  <div class="wrap">
    <span class="badge">Prototipo</span>
    <p>Datos de ejemplo. Prueba los dos lados: lo que ve el cliente y lo que ve el local.</p>
    <div class="switch" role="group" aria-label="Cambiar vista">
      <button type="button" id="vCliente" aria-pressed="true">Cliente</button>
      <button type="button" id="vLocal" aria-pressed="false">Local</button>
    </div>
    <button class="linkbtn" type="button" id="resetDemo">Reiniciar demo</button>
  </div>
</div>

<main id="cliente" class="phone wrap"></main>
<main id="local" class="panel wrap" hidden></main>
<div class="toast" id="toast" hidden></div>

<script>
/* ================= Ajustes del Club (editables) ================= */
const CONFIG = {
  visitsForPrize: 10,
  prize: "1 pizza gratis a elección",
  birthdayGift: "Postre gratis para el cumpleañero, o una Pizza Nutella por cada 6 personas en su mesa",
  referralBonus: 1,                 // visitas extra para ambos al invitar
  riskDays: 30, lostDays: 60,       // segmentos: activo ≤30 días, en riesgo 31–60, perdido >60
  googleReviewUrl: "https://g.page/r/CcTIIN9Gqc2wEAE/review",
  imgBase: "../img/",
};
/* =============================================================== */

const DAY = 864e5;
const today = new Date(); today.setHours(12,0,0,0);
const daysAgo = n => new Date(today - n*DAY).toISOString().slice(0,10);
const fmtDate = iso => new Date(iso+"T12:00:00").toLocaleDateString("es-CL",{day:"numeric",month:"short"});
const fmtLong = iso => new Date(iso+"T12:00:00").toLocaleDateString("es-CL",{month:"long",year:"numeric"});
const diffDays = iso => Math.round((today - new Date(iso+"T12:00:00"))/DAY);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);

/* ----- Datos de ejemplo ----- */
function seed(){
  const people = [
    ["Camila Rojas","+56 9 8123 4567",7,4,"1993-"+String(today.getMonth()+1).padStart(2,"0")+"-18",210],
    ["Matías Fuentes","+56 9 7234 5678",10,2,"1988-03-02",260],
    ["Valentina Soto","+56 9 6345 6789",3,12,"1997-07-21",95],
    ["Benjamín Muñoz","+56 9 5456 7890",1,1,"1990-11-09",1],
    ["Javiera Contreras","+56 9 9567 8901",5,38,"1995-01-30",180],
    ["Diego Sepúlveda","+56 9 8678 9012",8,9,"1985-"+String(today.getMonth()+1).padStart(2,"0")+"-03",240],
    ["Francisca Morales","+56 9 7789 0123",2,75,"1999-05-14",120],
    ["Tomás Araya","+56 9 6890 1234",4,44,"1992-09-27",150],
    ["Isidora Vargas","+56 9 5901 2345",6,6,"1996-12-12",170],
    ["Sebastián Reyes","+56 9 9012 3456",1,0,"1991-04-04",0],
    ["Antonia Castillo","+56 9 8111 2233",9,15,"1994-06-19",230],
    ["Joaquín Pizarro","+56 9 7222 3344",2,52,"1987-08-08",90],
    ["Martina Espinoza","+56 9 6333 4455",3,92,"1998-02-25",200],
    ["Cristóbal Navarro","+56 9 5444 5566",1,3,"1993-10-16",3],
    ["Fernanda Tapia","+56 9 9555 6677",4,20,"1990-"+String(today.getMonth()+1).padStart(2,"0")+"-27",110],
    ["Nicolás Herrera","+56 9 8666 7788",2,33,"1989-07-07",70],
    ["Catalina Ortiz","+56 9 7777 8899",5,63,"1997-03-13",190],
    ["Felipe Gutiérrez","+56 9 6888 9900",3,8,"1986-11-22",60],
  ];
  const comments = ["Riquísima la masa, volveremos","La burrata es otro nivel","Demoró un poco la pizza","Excelente atención del garzón","Muy buen pisco sour de mango","Había mucho ruido","Todo perfecto, 10/10"];
  const customers = people.map(([name,phone,stamps,lastAgo,birthday,joinedAgo],i)=>{
    const visits=[]; let d=lastAgo;
    for(let k=0;k<stamps;k++){ visits.push(daysAgo(d)); d+= 6 + (i*7+k*5)%14; }
    return {id:"c"+i,name,phone,email:"",birthday,stamps:stamps%CONFIG.visitsForPrize,total:stamps,redeemed:stamps>=CONFIG.visitsForPrize?0:0,
      visits:visits.sort(),joined:daysAgo(Math.max(joinedAgo,lastAgo)),code:(name.split(" ")[0].toUpperCase().normalize("NFD").replace(/[^A-Z]/g,"")+"-"+(37+i*13)),
      referredBy:null};
  });
  customers[1].stamps=10; // Matías tiene su premio listo
  const ratings = [];
  customers.forEach((c,i)=>{ if(c.visits.length && i%3!==2){ const s=[5,5,4,3,5,2,4][i%7]; ratings.push({id:"r"+i,cid:c.id,date:c.visits[c.visits.length-1],stars:s,tags:s>=4?["Pizza","Atención"]:["Tiempo de espera"],comment:comments[i%7],handled:false}); }});
  return {
    customers, ratings,
    promos:[
      {id:"p1",title:"Martes de pisco sour",detail:"2x1 en pisco sour de sabores, solo socios.",audience:"Socios",img:"coctel",until:daysAgo(-10)},
      {id:"p2",title:"Pizza Brisket: pruébala primero",detail:"Socios con 5 o más visitas: 20% de descuento esta semana.",audience:"Socios",img:"pizzero",until:daysAgo(-6),early:true},
    ],
    me:null, pendingRating:null, campaigns:[],
  };
}
let S;
function load(){ try{ const raw=localStorage.getItem("rustico-club-demo"); if(raw){ S=JSON.parse(raw); return; } }catch(e){} S=seed(); }
function save(){ try{ localStorage.setItem("rustico-club-demo",JSON.stringify(S)); }catch(e){} }
load();

function toast(msg){ const t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2600); }
function lastVisit(c){ return c.visits.length? c.visits[c.visits.length-1] : null; }
function segment(c){
  const lv=lastVisit(c); if(!lv) return "new";
  const d=diffDays(lv);
  if(c.total<=1 && d<=CONFIG.riskDays) return "new";
  if(d<=CONFIG.riskDays) return "active";
  if(d<=CONFIG.lostDays) return "risk";
  return "lost";
}
const SEG = {new:["Nuevo","s-new"],active:["Activo","s-active"],risk:["En riesgo","s-risk"],lost:["Perdido","s-lost"]};
const segPill = c => { const [t,k]=SEG[segment(c)]; return `<span class="pill ${k}">${t}</span>`; };
const isBirthdayMonth = c => c.birthday && +c.birthday.slice(5,7)===today.getMonth()+1;
const starSvg = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3 6.6 7.2.7-5.4 4.8 1.6 7.1L12 17.6 5.6 21.2l1.6-7.1L1.8 9.3 9 8.6z"/></svg>';
const copy = async (text) => { try{ await navigator.clipboard.writeText(text); toast("Copiado"); }catch(e){ toast("Selecciona el texto y cópialo"); } };

/* ================= VISTA CLIENTE ================= */
function renderClient(){
  const el=$("cliente");
  const me = S.me && S.customers.find(c=>c.id===S.me);
  if(!me){ el.innerHTML = registerView(); bindRegister(); return; }
  const n=CONFIG.visitsForPrize, st=Math.min(me.stamps,n), left=n-st, ready=st>=n;
  const stamps = Array.from({length:n},(_,i)=> i===n-1
      ? `<span class="prize${ready?" ready":""}">Pizza<br>gratis</span>`
      : `<span class="${i<st?"on":""}">${i+1}</span>`).join("");
  const promos = S.promos.filter(p=>p.audience!=="En riesgo" || segment(me)==="risk");
  el.innerHTML = `
    <div class="app-head"><img src="${CONFIG.imgBase}logo-color.png" alt="Rusti-Co."><span class="label">Club</span></div>
    <div class="hello"><h1>Hola, ${esc(me.name.split(" ")[0])}</h1>
      <p>${ready?"¡Tu pizza gratis está lista!":`Te ${left===1?"falta 1 visita":`faltan ${left} visitas`} para tu pizza gratis.`}</p></div>

    <div class="card" style="margin-top:18px">
      <div class="card-top"><span class="label">Tarjeta de socio</span><span class="small muted tabular">${esc(me.phone)}</span></div>
      <div class="stamps">${stamps}</div>
      <div class="bar"><i style="width:${st/n*100}%"></i></div>
      <div class="card-foot"><span>Socio desde ${fmtLong(me.joined)}</span><b class="tabular">${st} / ${n}</b></div>
      ${ready?`<div class="prize-box"><span class="label" style="color:var(--gold-ink)">Muestra este código al pagar</span><code>${esc(me.code)}</code><span class="small">${esc(CONFIG.prize)}</span></div>`:""}
    </div>

    ${S.pendingRating ? rateView() : ""}

    ${isBirthdayMonth(me)?`<div class="box" style="margin-top:16px;border-color:var(--gold)"><span class="label" style="color:var(--gold)">Es tu mes</span><h3 style="margin-top:6px">Feliz cumpleaños 🎂</h3><p class="muted small" style="margin-top:4px">Durante todo tu mes: ${esc(CONFIG.birthdayGift.charAt(0).toLowerCase()+CONFIG.birthdayGift.slice(1))}. Muestra esta pantalla en el local.</p></div>`:""}

    <div class="section-title"><h2>Para socios</h2><span class="label">${promos.length} activas</span></div>
    <div class="stack">${promos.map(p=>`
      <div class="box promo"><img src="${CONFIG.imgBase}${esc(p.img||"pizzero")}.jpg" alt="">

function bindRegister(){
  $("regForm").addEventListener("submit",e=>{
    e.preventDefault();
    const name=$("rName").value.trim(), phone=$("rPhone").value.trim(), err=$("regErr");
    const digits=phone.replace(/\D/g,"");
    if(name.length<3){ err.textContent="Escribe tu nombre y apellido."; err.hidden=false; return; }
    if(digits.length<9){ err.textContent="Revisa tu teléfono: debe tener al menos 9 dígitos."; err.hidden=false; return; }
    if(!$("rOk").checked){ err.textContent="Para crear tu tarjeta necesitamos tu autorización para guardar tus datos."; err.hidden=false; return; }
    const existing=S.customers.find(c=>c.phone.replace(/\D/g,"").endsWith(digits.slice(-9)));
    if(existing){ S.me=existing.id; save(); renderClient(); toast("Bienvenido de vuelta"); return; }
    const ref=$("rRef").value.trim().toUpperCase();
    const refBy=ref && S.customers.find(c=>c.code===ref);
    const c={id:"c"+Date.now(),name,phone,email:$("rMail").value.trim(),birthday:$("rBday").value||"",stamps:0,total:0,visits:[],
      joined:today.toISOString().slice(0,10),code:name.split(" ")[0].toUpperCase().normalize("NFD").replace(/[^A-Z]/g,"")+"-"+(10+Math.floor(Math.random()*89)),referredBy:refBy?refBy.id:null};
    S.customers.push(c); S.me=c.id; save(); renderClient();
    toast(refBy?`Tarjeta creada. Tú y ${refBy.name.split(" ")[0]} sumarán una visita extra.`:"Tarjeta creada. ¡Bienvenido al Club!");
  });
}

function bindRate(me){
  let val=0;
  const btns=[...document.querySelectorAll("#stars button")];
  btns.forEach(b=>b.onclick=()=>{ val=+b.dataset.v; btns.forEach(x=>x.classList.toggle("on",+x.dataset.v<=val)); $("rateMore").hidden=false;
    $("rateQ").textContent = val>=4 ? "¡Qué bueno! ¿Qué fue lo mejor?" : "Lo sentimos. ¿Qué podemos mejorar?"; });
  document.querySelectorAll("#rateTags button").forEach(b=>b.onclick=()=>b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")!=="true"));
  $("rateSend").onclick=()=>{
    const tags=[...document.querySelectorAll('#rateTags button[aria-pressed="true"]')].map(b=>b.textContent);
    S.ratings.unshift({id:"r"+Date.now(),cid:me.id,date:today.toISOString().slice(0,10),stars:val,tags,comment:$("rateTxt").value.trim(),handled:false});
    S.pendingRating=null; save();
    const box=$("rateBox");
    box.innerHTML = val>=4
      ? `<span class="label" style="color:var(--gold)">Gracias</span><h3 style="margin:6px 0 8px">¡Nos alegra que lo hayas disfrutado!</h3><p class="small muted" style="margin-bottom:12px">¿Nos regalas 30 segundos en Google? Ayuda mucho a un local nuevo.</p><a class="btn btn-gold btn-block" href="${CONFIG.googleReviewUrl}" target="_blank" rel="noopener">Dejar reseña en Google</a>`
      : `<span class="label" style="color:var(--gold)">Gracias</span><h3 style="margin:6px 0 8px">Gracias por contarnos</h3><p class="small muted" style="margin-bottom:12px">El encargado ya recibió tu comentario y te escribirá para solucionarlo. Si quieres, también puedes dejar tu reseña en Google.</p><a class="btn btn-line btn-block" href="${CONFIG.googleReviewUrl}" target="_blank" rel="noopener">Calificar en Google</a>`;
  };
}

        <button class="btn btn-gold" type="submit">Publicar en la app</button>
      </form>
      <div class="box stack"><span class="label">Activas · las ven los socios en su app</span>
        ${S.promos.map(p=>`<div class="promo" style="padding:8px 0;border-bottom:1px solid var(--line)"><img src="${CONFIG.imgBase}${esc(p.img||"pizzero")}.jpg" alt="">
          <div><h3>${esc(p.title)}</h3><p>${esc(p.detail)}</p><p class="small">${esc(p.audience)} · hasta el ${fmtDate(p.until)} <button class="linkbtn" type="button" data-del="${p.id}">Quitar</button></p></div></div>`).join("")||'<p class="small muted">No hay promociones activas.</p>'}
      </div>
    </div>`;
  $("promoForm").addEventListener("submit",e=>{ e.preventDefault();
    const t=$("pTitle").value.trim(), d=$("pDetail").value.trim();
    if(!t||!d){ $("pErr").textContent="Completa el título y el detalle."; $("pErr").hidden=false; return; }
    S.promos.unshift({id:"p"+Date.now(),title:t,detail:d,audience:$("pAud").value,until:$("pUntil").value||daysAgo(-7),img:"schop",early:$("pEarly").checked});
    save(); pPromos(); toast("Publicada. Ya aparece en la app del cliente.");
  });
  $("pbody").querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ S.promos=S.promos.filter(p=>p.id!==b.dataset.del); save(); pPromos(); });
}

function pClientes(){
  const cs=S.customers.slice().sort((a,b)=>(lastVisit(b)||"").localeCompare(lastVisit(a)||""));
  $("pbody").innerHTML = `
    <div class="table-wrap"><table>
      <thead><tr><th>Socio</th><th>Teléfono</th><th>Estado</th><th class="num">Sellos</th><th class="num">Visitas</th><th>Última visita</th><th>Cumpleaños</th><th>Socio desde</th></tr></thead>
      <tbody>${cs.map(c=>`<tr><td>${esc(c.name)}</td><td class="tabular">${esc(c.phone)}</td><td>${segPill(c)}</td><td class="num">${c.stamps}/${CONFIG.visitsForPrize}</td><td class="num">${c.total}</td><td>${lastVisit(c)?fmtDate(lastVisit(c)):"—"}</td><td>${c.birthday?fmtDate(today.getFullYear()+c.birthday.slice(4)):"—"}</td><td>${fmtDate(c.joined)}</td></tr>`).join("")}</tbody>
    </table></div>
    <p class="small muted" style="margin-top:12px">${cs.length} socios. En la versión final podrás descargar esta lista en Excel.</p>`;
}

/* ================= Cambio de vista ================= */
function setView(v){
  $("cliente").hidden = v!=="cliente"; $("local").hidden = v!=="local";
  $("vCliente").setAttribute("aria-pressed",v==="cliente"); $("vLocal").setAttribute("aria-pressed",v==="local");
  v==="cliente"?renderClient():renderLocal();
  window.scrollTo(0,0);
}
$("vCliente").onclick=()=>setView("cliente");
$("vLocal").onclick=()=>setView("local");
$("resetDemo").onclick=()=>{ try{localStorage.removeItem("rustico-club-demo");}catch(e){} S=seed(); query=""; selected=null; ptab="caja"; setView("cliente"); toast("Demo reiniciada"); };
setView(location.hash==="#local"?"local":"cliente");
</script>
